<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>The Inkwell Repository</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; color: #e5e7eb; margin: 0; padding: 0; }
        /* Prevent horizontal scroll bugs on mobile */
        .site-container { overflow-x: hidden; max-width: 100vw; position: relative; }
        .glass-header { backdrop-filter: blur(12px); background-color: rgba(15, 15, 15, 0.85); z-index: 100; }
        .hero-gradient { background: radial-gradient(circle at center, rgba(30, 30, 30, 1) 0%, rgba(15, 15, 15, 1) 100%); }
    </style>
</head>
<body>
    <script>
        // CONFIGURATION: Swap these links for your real assets
        const REPOSITORY_DATA = {
            brandName: "The Inkwell Repository",
            logoSrc: "https://placehold.co/512x512/333/fff?text=MASTER+SEAL", // Replace with your Seal URL
            hero: {
                title: "The Inkwell Repository",
                subtitle: "Infrastructure for Strategic Distribution & Creative Stewardship",
                body: "A centralized engine managing the transition from development to market through specialized logistical support and digital asset management."
            },
            aboutHtml: `
                <p class="mb-4">The Inkwell Repository serves as a centralized hub for strategic distribution and creative infrastructure. We provide the operational frameworks necessary for independent brands to scale.</p>
                <p>Our mission is to bridge the gap between production and professional distribution, ensuring long-term creative stewardship through structured asset management.</p>
            `,
            collections: [
                { title: "Literary Distribution", category: "DISTRIBUTION", desc: "Centralized archival and marketplace infrastructure for independent literature.", link: "#" },
                { title: "Digital Assets", category: "ARCHIVE", desc: "Secure repositories for high-fidelity creative blueprints and digital media.", link: "#" },
                { title: "Professional Services", category: "SERVICES", desc: "Consulting and logistical management for creative startups.", link: "#" }
            ]
        };
    </script>

    <div class="site-container">
        <header class="glass-header sticky top-0 w-full border-b border-white/10 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="font-bold tracking-tight text-lg">The Inkwell Repository</span>
            </div>
            <nav class="hidden md:flex gap-8 text-sm font-medium opacity-70">
                <a href="#about" class="hover:opacity-100 transition">About</a>
                <a href="#collections" class="hover:opacity-100 transition">Collections</a>
                <a href="#contact" class="hover:opacity-100 transition">Contact</a>
            </nav>
            <button class="md:hidden opacity-70" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">Menu</button>
        </header>

        <div id="mobile-menu" class="hidden fixed inset-0 bg-[#0f0f0f] z-[110] flex flex-col p-10 gap-6 text-2xl font-bold">
            <button class="self-end text-sm opacity-50 mb-10" onclick="document.getElementById('mobile-menu').classList.add('hidden')">CLOSE [X]</button>
            <a href="#about" onclick="document.getElementById('mobile-menu').classList.add('hidden')">About</a>
            <a href="#collections" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Collections</a>
            <a href="#contact" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Contact</a>
        </div>

        <section class="hero-gradient min-h-[90vh] flex flex-col items-center justify-center text-center px-6 py-20">
            <img id="main-seal" src="" alt="Master Seal" class="w-32 h-32 md:w-48 md:h-48 mb-8 border border-white/10 rounded-full">
            <h1 class="text-4xl md:text-7xl font-bold mb-4 tracking-tighter" id="hero-title"></h1>
            <p class="text-lg md:text-2xl opacity-60 mb-8 max-w-2xl font-light" id="hero-subtitle"></p>
            <div class="flex gap-4">
                <a href="#collections" class="bg-white text-black px-8 py-3 font-semibold rounded-sm hover:bg-gray-200 transition">View Assets</a>
                <a href="#about" class="border border-white/20 px-8 py-3 font-semibold rounded-sm hover:bg-white/5 transition">Our Mandate</a>
            </div>
        </section>

        <section id="collections" class="max-w-7xl mx-auto px-6 py-24">
            <h2 class="text-xs font-bold tracking-[0.2em] opacity-40 mb-12 uppercase">Centralized Collections</h2>
            <div id="grid-container" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </section>

        <section id="about" class="max-w-4xl mx-auto px-6 py-24 border-t border-white/5">
            <h2 class="text-2xl font-bold mb-8">About the Repository</h2>
            <div id="about-content" class="text-lg opacity-60 leading-relaxed font-light"></div>
        </section>

        <footer class="p-12 border-t border-white/5 text-center opacity-30 text-sm">
            <p>&copy; 2026 The Inkwell Repository. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // DOM Injection Logic
        document.getElementById('hero-title').innerText = REPOSITORY_DATA.hero.title;
        document.getElementById('hero-subtitle').innerText = REPOSITORY_DATA.hero.subtitle;
        document.getElementById('main-seal').src = REPOSITORY_DATA.logoSrc;
        document.getElementById('about-content').innerHTML = REPOSITORY_DATA.aboutHtml;

        const grid = document.getElementById('grid-container');
        REPOSITORY_DATA.collections.forEach(item => {
            const card = `
                <div class="group border border-white/10 p-1 bg-white/5 hover:border-white/30 transition-all cursor-pointer">
                    <div class="aspect-video bg-neutral-800 mb-4 overflow-hidden">
                        <img src="https://placehold.co/600x337/222/555?text=COLLECTION+IMPRINT" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500">
                    </div>
                    <div class="p-4">
                        <span class="text-[10px] font-bold tracking-widest opacity-40">${item.category}</span>
                        <h3 class="text-xl font-bold mt-1 mb-2">${item.title}</h3>
                        <p class="text-sm opacity-50 mb-6">${item.desc}</p>
                        <a href="${item.link}" class="inline-block text-xs font-bold border-b border-white/40 pb-1 hover:border-white transition-all">ENTER REPOSITORY</a>
                    </div>
                </div>
            `;
            grid.innerHTML += card;
        });
    </script>
</body>
</html>
