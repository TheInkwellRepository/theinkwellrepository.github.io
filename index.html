<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>The Inkwell Repository | Strategic Stewardship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f7f2; color: #1a1a1a; margin: 0; padding: 0; scroll-behavior: smooth; }
        h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
        .site-container { overflow-x: hidden; max-width: 100vw; position: relative; }
        .glass-header { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.9); z-index: 100; border-bottom: 1px solid rgba(0, 0, 0, 0.1); }
        .hero-bright { background: radial-gradient(circle at 50% 30%, rgba(218, 165, 32, 0.3) 0%, rgba(249, 247, 242, 1) 90%); }
        
        /* Core 6 Spacing & Divider Logic */
        .blueprint-row { padding-top: 2rem; padding-bottom: 2rem; }
        .blueprint-divider { position: relative; height: 1.5px; background: rgba(26, 26, 26, 0.4); margin: 1.5rem 0; width: 100%; }
        .blueprint-divider::after { content: '◈'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #991b1b; font-size: 14px; background: #fcfaf5; padding: 0 15px; }

        .btn-crimson { background-color: #991b1b; transition: all 0.3s ease; }
        .btn-crimson:hover { background-color: #000; transform: translateY(-2px); }

        /* Burger Menu Styling */
        #mobile-menu { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        #mobile-menu.active { transform: translateX(0); }
        .burger-line { height: 2px; width: 24px; background-color: #1a1a1a; transition: 0.3s; }
    </style>
</head>
<body>
    <script>
        const REPOSITORY_DATA = {
            brandName: "The Inkwell Repository",
            logoSrc: "./red-wax-seal.png",
            hero: { title: "The Inkwell Repository", subtitle: "Strategic Brand Management. Professional Distribution." },
            blueprints: [
                { title: "Brand Clarity & Protection", video: "brand-clarity-shield.mp4", desc: "Before you scale, you have to be sure of your footing. Foundational audit for precise stewardship.", file: "Brand-Clarity-Three-Tools-to-Organize-and-Protect-Your-Work.pdf" },
                { title: "The Stakeholder Update", video: "stakeholder-typewriter.mp4", desc: "Turn followers into partners by sharing your journey—the wins, the hurdles, and the vision.", file: "The-Stakeholder-Update.pdf" },
                { title: "The Social Media Multiplier", video: "social-multiplier-globe.mp4", desc: "A mechanical system for turning quiet work into a loud presence without losing focus.", file: "The-Social-Media-Multiplier.pdf" },
                { title: "The Client Experience", video: "client-experience-trust.mp4", desc: "Build a system that makes every client feel like your only client.", file: "The-Client-Experience-Blueprint.pdf" },
                { title: "The Consistency Calendar", video: "consistency-grind.mp4", desc: "Tactical plan to maintain momentum without burnout.", file: "Building-momentum-by-showing-up-even-on-the-quiet-days.pdf" },
                { title: "The Professional Pivot", video: "professional-pivot-horizon.mp4", desc: "Change lanes without losing momentum using your existing experience.", file: "How-to-change-lanes-without-losing-your-momentum.pdf" }
            ]
        };
    </script>

    <div class="site-container">
        <header class="glass-header sticky top-0 w-full px-6 py-4 flex justify-between items-center">
            <span class="brand-font font-bold tracking-tight text-xl text-[#991b1b]">Established 2026</span>
            <button onclick="toggleMenu()" class="z-[110] flex flex-col gap-1.5 p-2 focus:outline-none">
                <div class="burger-line"></div>
                <div class="burger-line"></div>
                <div class="burger-line"></div>
            </button>
        </header>

        <div id="mobile-menu" class="fixed inset-0 bg-[#f9f7f2] z-[105] flex flex-col items-center justify-center">
            <nav class="flex flex-col gap-10 text-center">
                <a href="#about" onclick="toggleMenu()" class="brand-font text-3xl hover:text-[#991b1b]">THE MANDATE</a>
                <a href="#collections" onclick="toggleMenu()" class="brand-font text-3xl hover:text-[#991b1b]">HOLDINGS</a>
                <a href="#blueprints" onclick="toggleMenu()" class="brand-font text-3xl hover:text-[#991b1b]">BLUEPRINTS</a>
            </nav>
        </div>

        <section class="hero-bright min-h-[70vh] flex flex-col items-center justify-center text-center px-6">
            <img id="main-seal" src="./red-wax-seal.png" alt="Master Seal" class="w-44 h-44 mb-4 drop-shadow-xl">
            <h1 class="text-3xl md:text-5xl font-bold mb-6 tracking-[0.2em] uppercase text-[#1a1a1a]">The Inkwell Repository</h1>
            <p class="text-lg md:text-2xl text-gray-500 mb-10 max-w-2xl font-light italic">Strategic Brand Management. Professional Distribution.</p>
        </section>

        <section id="blueprints" class="bg-[#fcfaf5] py-16 border-t border-gray-100"> 
            <div class="max-w-6xl mx-auto px-6">
                <div class="text-center mb-16">
                    <h2 class="text-xs font-bold tracking-[0.5em] text-[#b8860b] uppercase mb-4">Core Blueprints</h2>
                    <h3 class="brand-font text-3xl md:text-5xl font-bold text-[#1a1a1a]">Essential Infrastructure</h3>
                </div>
                <div id="blueprints-container" class="flex flex-col"></div>
            </div>
        </section>

        <footer class="p-12 border-t border-gray-100 text-center text-gray-400 text-[10px] tracking-[0.3em] uppercase">
            <p>&copy; 2026 The Inkwell Repository. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('active');
        }

        const blueprintsContainer = document.getElementById('blueprints-container');
        REPOSITORY_DATA.blueprints.forEach((bp, index) => {
            const isEven = index % 2 !== 0;
            const isLast = index === REPOSITORY_DATA.blueprints.length - 1;
            
            blueprintsContainer.innerHTML += `
                <div class="blueprint-row flex flex-col ${isEven ? 'md:flex-row-reverse' : 'md:flex-row'} items-center gap-8 lg:gap-16">
                    <div class="w-full md:w-1/2 shadow-xl rounded-sm overflow-hidden bg-black aspect-video">
                        <video class="w-full h-full object-cover" autoplay muted loop playsinline preload="auto"><source src="${bp.video}" type="video/mp4"></video>
                    </div>
                    <div class="w-full md:w-1/2 flex flex-col items-start px-4">
                        <span class="text-[9px] font-bold tracking-[0.4em] text-[#b8860b] uppercase mb-2">Module 0${index + 1}</span>
                        <h3 class="text-2xl lg:text-3xl font-bold mb-4 brand-font">${bp.title}</h3>
                        <p class="text-gray-600 text-base font-light mb-6">${bp.desc}</p>
                        <a href="${bp.file}" download class="btn-crimson text-white px-8 py-3 text-[10px] font-bold uppercase tracking-widest">Download Blueprint</a>
                    </div>
                </div>
                ${!isLast ? '<div class="blueprint-divider"></div>' : ''}
            `;
        });
    </script>
</body>
</html>
