<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>The Inkwell Repository | Strategic Stewardship</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f7f2; color: #1a1a1a; margin: 0; padding: 0; scroll-behavior: smooth; }
        h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
        .site-container { overflow-x: hidden; max-width: 100vw; position: relative; }
        
        .glass-header { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.8); z-index: 100; border-bottom: 1px solid rgba(153, 27, 27, 0.1); }
        .hero-bright { background: radial-gradient(circle at 50% 30%, rgba(218, 165, 32, 0.3) 0%, rgba(249, 247, 242, 1) 90%); }

        .blueprint-container { position: relative; width: 100%; aspect-ratio: 16 / 9; background-color: #000; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .blueprint-video { width: 100%; height: 100%; object-fit: cover; }

        /* The Layered Overlay */
        .video-overlay { 
            position: absolute; 
            top: 0; 
            right: 0; 
            width: 50%; /* Sits on the right-half white space */
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 2rem;
            z-index: 10;
        }

        .btn-crimson { background-color: #991b1b; transition: all 0.3s ease; display: inline-block; width: 100%; text-align: center; }
        .btn-crimson:hover { background-color: #000; transform: translateY(-2px); }

        /* Responsive: On mobile, move text below video */
        @media (max-width: 768px) {
            .blueprint-container { aspect-ratio: auto; }
            .video-overlay { position: relative; width: 100%; height: auto; background: white; padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <script>
        const REPOSITORY_DATA = {
            logoSrc: "./red-wax-seal.png",
            hero: { title: "The Inkwell Repository", subtitle: "Strategic Brand Management. Professional Distribution." },
            blueprints: [
                { title: "Brand Clarity & Protection", video: "brand-clarity-shield.mp4", desc: "Before you scale, you have to be sure of your footing. Strip away the noise." },
                { title: "The Stakeholder Update", video: "stakeholder-typewriter.mp4", desc: "Turn your followers into true partners by sharing your journey." },
                { title: "Social Media Multiplier", video: "social-multiplier-globe.mp4", desc: "A mechanical system for turning quiet work into a loud presence." },
                { title: "The Client Experience", video: "client-experience-trust.mp4", desc: "Build a system that makes every client feel like your only client." },
                { title: "The Consistency Calendar", video: "consistency-grind.mp4", desc: "Breaking down the heavy lifting of the daily grind." },
                { title: "The Professional Pivot", video: "professional-pivot-horizon.mp4", desc: "Every bridge you've crossed prepared you for the new horizon." }
            ]
        };
    </script>

    <div class="site-container">
        <header class="glass-header sticky top-0 w-full px-6 py-4 flex justify-between items-center">
            <span class="brand-font font-bold tracking-tight text-xl text-[#991b1b]">Established 2026</span>
            <nav class="hidden md:flex gap-8 text-[10px] font-bold tracking-[0.2em] text-gray-500">
                <a href="#blueprints" class="hover:text-red-800 transition">BLUEPRINTS</a>
            </nav>
        </header>

        <section id="blueprints" class="max-w-6xl mx-auto py-24 px-6 flex flex-col gap-24">
            <h2 class="text-[10px] font-bold tracking-[0.5em] text-[#991b1b] mb-12 uppercase text-center">The Core Six Blueprints</h2>
            <div id="blueprints-list" class="flex flex-col gap-20"></div>
        </section>
    </div>

    <script>
        document.querySelector('.hero-bright img')?.setAttribute('src', REPOSITORY_DATA.logoSrc);

        const list = document.getElementById('blueprints-list');
        REPOSITORY_DATA.blueprints.forEach((bp, index) => {
            list.innerHTML += `
                <div class="blueprint-container">
                    <video class="blueprint-video" autoplay muted loop playsinline>
                        <source src="${bp.video}" type="video/mp4">
                    </video>
                    <div class="video-overlay">
                        <span class="text-[8px] font-bold tracking-[0.3em] text-[#b8860b] uppercase mb-2">Module 0${index + 1}</span>
                        <h3 class="brand-font text-xl lg:text-2xl font-bold mb-3">${bp.title}</h3>
                        <p class="text-[11px] text-gray-600 mb-6 font-light leading-relaxed max-w-xs">${bp.desc}</p>
                        <div class="flex flex-col gap-3">
                            <a href="#" class="btn-crimson text-white py-3 text-[9px] font-bold uppercase tracking-widest shadow-md">Secure the Blueprint</a>
                            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-[0.1em] text-center">Download PDF Document</p>
                            <a href="#" class="text-[8px] text-[#991b1b] font-bold uppercase tracking-widest hover:underline text-center">View a sample before download</a>
                        </div>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
