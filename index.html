<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>The Inkwell Repository</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; color: #e5e7eb; margin: 0; padding: 0; }
        .site-container { overflow-x: hidden; max-width: 100vw; position: relative; }
        
        /* Glass Header with subtle red tint */
        .glass-header { 
            backdrop-filter: blur(12px); 
            background-color: rgba(15, 15, 15, 0.9); 
            z-index: 100; 
            border-bottom: 1px solid rgba(153, 27, 27, 0.2);
        }

        /* The "Atmospheric Glow" behind your seal */
        .hero-glow { 
            background: radial-gradient(circle at center, rgba(153, 27, 27, 0.15) 0%, rgba(15, 15, 15, 1) 70%); 
        }

        /* Wax-Red Accents */
        .accent-red { color: #991b1b; }
        .bg-wax-red { background-color: #991b1b; }
        .border-wax-red { border-color: rgba(153, 27, 27, 0.4); }
        
        .card-hover:hover {
            border-color: rgba(153, 27, 27, 0.8);
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <script>
        const REPOSITORY_DATA = {
            brandName: "The Inkwell Repository",
            logoSrc: "./red-wax-seal.png", // YOUR LOGO CONNECTED
            hero: {
                title: "The Inkwell Repository",
                subtitle: "Infrastructure for Strategic Distribution & Creative Stewardship",
                body: "A centralized engine managing the transition from development to market through specialized logistical support and digital asset management."
            },
            aboutHtml: `
                <p class="mb-4">The Inkwell Repository serves as a centralized hub for strategic distribution and creative infrastructure. We provide the operational frameworks necessary for independent brands to scale.</p>
                <p>Our mission is to bridge the gap between production and professional distribution, ensuring long-term creative stewardship through structured asset management.</p>
            `,
            collections: [
                { title: "Literary Distribution", category: "DISTRIBUTION", desc: "Centralized archival and marketplace infrastructure for independent literature.", link: "#" },
                { title: "Digital Assets", category: "ARCHIVE", desc: "Secure repositories for high-fidelity creative blueprints and digital media.", link: "#" },
                { title: "Professional Services", category: "SERVICES", desc: "Consulting and logistical management for creative startups.", link: "#" }
            ]
        };
    </script>

    <div class="site-container">
        <header class="glass-header sticky top-0 w-full px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="font-bold tracking-tight text-lg uppercase">The Inkwell Repository</span>
            </div>
            <nav class="hidden md:flex gap-8 text-xs font-bold tracking-widest opacity-60">
                <a href="#about" class="hover:text-red-700 transition">ABOUT</a>
                <a href="#collections" class="hover:text-red-700 transition">COLLECTIONS</a>
                <a href="#contact" class="hover:text-red-700 transition">CONTACT</a>
            </nav>
            <button class="md:hidden opacity-70" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">MENU</button>
        </header>

        <div id="mobile-menu" class="hidden fixed inset-0 bg-[#0f0f0f] z-[110] flex flex-col p-10 gap-6 text-2xl font-bold">
            <button class="self-end text-sm opacity-50 mb-10" onclick="document.getElementById('mobile-menu').classList.add('hidden')">CLOSE [X]</button>
            <a href="#about" onclick="document.getElementById('mobile-menu').classList.add('hidden')">ABOUT</a>
            <a href="#collections" onclick="document.getElementById('mobile-menu').classList.add('hidden')">COLLECTIONS</a>
            <a href="#contact" onclick="document.getElementById('mobile-menu').classList.add('hidden')">CONTACT</a>
        </div>

        <section class="hero-glow min-h-[85vh] flex flex-col items-center justify-center text-center px-6 py-20">
            <img id="main-seal" src="" alt="Master Seal" class="w-40 h-40 md:w-56 md:h-56 mb-8 drop-shadow-[0_0_30px_rgba(153,27,27,0.3)]">
            <h1 class="text-4xl md:text-7xl font-bold mb-4 tracking-tighter uppercase" id="hero-title"></h1>
            <p class="text-lg md:text-xl opacity-60 mb-10 max-w-2xl font-light italic" id="hero-subtitle"></p>
            <div class="flex gap-4">
                <a href="#collections" class="bg-white text-black px-8 py-3 font-bold text-xs uppercase tracking-widest hover:bg-red-800 hover:text-white transition-all">View Assets</a>
                <a href="#about" class="border border-white/20 px-8 py-3 font-bold text-xs uppercase tracking-widest hover:bg-white/5 transition">Our Mandate</a>
            </div>
        </section>

        <section id="collections" class="max-w-7xl mx-auto px-6 py-24">
            <h2 class="text-[10px] font-bold tracking-[0.4em] opacity-30 mb-12 uppercase text-center">Centralized Collections</h2>
            <div id="grid-container" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </section>

        <section id="about" class="max-w-4xl mx-auto px-6 py-24 border-t border-red-900/20">
            <h2 class="text-2xl font-bold mb-8 uppercase tracking-widest border-b border-red-900/40 pb-4 inline-block">The Mandate</h2>
            <div id="about-content" class="text-lg opacity-60 leading-relaxed font-light"></div>
        </section>

        <footer class="p-12 border-t border-white/5 text-center opacity-20 text-[10px] tracking-[0.3em] uppercase">
            <p>&copy; 2026 The Inkwell Repository. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // DOM Injection
        document.getElementById('hero-title').innerText = REPOSITORY_DATA.hero.title;
        document.getElementById('hero-subtitle').innerText = REPOSITORY_DATA.hero.subtitle;
        document.getElementById('main-seal').src = REPOSITORY_DATA.logoSrc;
        document.getElementById('about-content').innerHTML = REPOSITORY_DATA.aboutHtml;

        const grid = document.getElementById('grid-container');
        REPOSITORY_DATA.collections.forEach(item => {
            const card = `
                <div class="card-hover border border-white/5 p-1 bg-white/[0.02]">
                    <div class="aspect-video bg-neutral-900 mb-4 overflow-hidden border border-white/5">
                        <img src="https://placehold.co/600x337/1a1a1a/444?text=IMPRINT" class="w-full h-full object-cover grayscale opacity-50 hover:opacity-100 transition-all duration-700">
                    </div>
                    <div class="p-6">
                        <span class="text-[9px] font-bold tracking-[0.3em] text-red-800 uppercase">${item.category}</span>
                        <h3 class="text-xl font-bold mt-2 mb-3 tracking-tight">${item.title}</h3>
                        <p class="text-sm opacity-50 mb-6 font-light leading-relaxed">${item.desc}</p>
                        <a href="${item.link}" class="inline-block text-[10px] font-bold tracking-widest border-b border-red-900/40 pb-1 hover:border-red-700 hover:text-red-700 transition-all uppercase">Enter Repository</a>
                    </div>
                </div>
            `;
            grid.innerHTML += card;
        });
    </script>
</body>
</html>
