<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>The Inkwell Repository</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Bright Gallery Aesthetic */
        body { font-family: 'Inter', sans-serif; background-color: #f9f7f2; color: #1a1a1a; margin: 0; padding: 0; }
        h1, h2, .brand-font { font-family: 'Playfair Display', serif; }
        
        .site-container { overflow-x: hidden; max-width: 100vw; position: relative; }
        
        /* Clean, Bright Header */
        .glass-header { 
            backdrop-filter: blur(12px); 
            background-color: rgba(255, 255, 255, 0.8); 
            z-index: 100; 
            border-bottom: 1px solid rgba(153, 27, 27, 0.1);
        }

        /* Warm Sun-kissed Glow behind your seal */
        .hero-bright { 
            background: radial-gradient(circle at 50% 30%, rgba(218, 165, 32, 0.3) 0%, rgba(249, 247, 242, 1) 90%); 
        }

        /* The Gold & Red Accents */
        .text-gold { color: #b8860b; }
        .bg-wax-red { background-color: #991b1b; }
        .border-gold { border-color: rgba(184, 134, 11, 0.3); }
        
        .card-hover {
            background: white;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card-hover:hover {
            border-color: #991b1b;
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(153, 27, 27, 0.1);
        }
    </style>
</head>
<body>
    <script>
        const REPOSITORY_DATA = {
            brandName: "The Inkwell Repository",
            logoSrc: "./red-wax-seal.png",
            hero: {
                title: "The Inkwell Repository",
                subtitle: "Strategic Distribution. Creative Stewardship.",
                body: "Operational frameworks for independent brands."
            },
            aboutHtml: `
                <p class="mb-4">The Inkwell Repository serves as a centralized hub for creative infrastructure. We provide the systems necessary for independent brands to transition from development to professional market distribution.</p>
            `,
            collections: [
                { title: "Literary Distribution", category: "DISTRIBUTION", desc: "Centralized archival and marketplace infrastructure.", link: "#" },
                { title: "Digital Assets", category: "ARCHIVE", desc: "Secure repositories for high-fidelity creative blueprints.", link: "#" },
                { title: "Infrastructure", category: "SYSTEMS", desc: "Logistical management for creative startups.", link: "#" }
            ]
        };
    </script>

    <div class="site-container">
        <header class="glass-header sticky top-0 w-full px-6 py-4 flex justify-between items-center">
            <span class="brand-font font-bold tracking-tight text-xl text-[#991b1b]">The Inkwell Repository</span>
            <nav class="hidden md:flex gap-8 text-[10px] font-bold tracking-[0.2em] text-gray-500">
                <a href="#about" class="hover:text-red-800 transition">ABOUT</a>
                <a href="#collections" class="hover:text-red-800 transition">COLLECTIONS</a>
                <a href="#contact" class="hover:text-red-800 transition">CONTACT</a>
            </nav>
            <button class="md:hidden text-gray-800" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">☰</button>
        </header>

        <section class="hero-bright min-h-[80vh] flex flex-col items-center justify-center text-center px-6 py-20">
            <img id="main-seal" src="" alt="Master Seal" class="w-44 h-44 md:w-60 md:h-60 mb-10 drop-shadow-xl">
            <h1 class="text-5xl md:text-8xl font-bold mb-6 tracking-tight text-[#1a1a1a]" id="hero-title"></h1>
            <p class="text-lg md:text-2xl text-gray-500 mb-10 max-w-2xl font-light italic" id="hero-subtitle"></p>
            <div class="flex gap-4">
                <a href="#collections" class="bg-[#991b1b] text-white px-10 py-4 font-bold text-xs uppercase tracking-widest shadow-lg hover:bg-black transition-all">Explore Archives</a>
                <a href="#about" class="border border-gray-200 px-10 py-4 font-bold text-xs uppercase tracking-widest hover:bg-gray-50 transition">The Mandate</a>
            </div>
        </section>

        <section id="collections" class="max-w-7xl mx-auto px-6 py-24 bg-white">
            <h2 class="text-[10px] font-bold tracking-[0.5em] text-[#b8860b] mb-16 uppercase text-center">Institutional Holdings</h2>
            <div id="grid-container" class="grid grid-cols-1 md:grid-cols-3 gap-12"></div>
        </section>

        <section id="about" class="max-w-4xl mx-auto px-6 py-24">
            <h2 class="brand-font text-3xl font-bold mb-8 text-[#991b1b]">The Mandate</h2>
            <div id="about-content" class="text-xl text-gray-600 leading-relaxed font-light"></div>
        </section>

        <footer class="p-12 border-t border-gray-100 text-center text-gray-400 text-[10px] tracking-[0.3em] uppercase">
            <p>&copy; 2026 The Inkwell Repository. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        document.getElementById('hero-title').innerText = REPOSITORY_DATA.hero.title;
        document.getElementById('hero-subtitle').innerText = REPOSITORY_DATA.hero.subtitle;
        document.getElementById('main-seal').src = REPOSITORY_DATA.logoSrc;
        document.getElementById('about-content').innerHTML = REPOSITORY_DATA.aboutHtml;

        const grid = document.getElementById('grid-container');
        REPOSITORY_DATA.collections.forEach(item => {
            const card = `
                <div class="card-hover p-2">
                    <div class="aspect-[4/5] bg-gray-100 mb-6 overflow-hidden">
                        <img src="https://placehold.co/600x750/f0f0f0/991b1b?text=${item.category}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-6 text-center">
                        <span class="text-[9px] font-bold tracking-[0.3em] text-[#b8860b] uppercase">${item.category}</span>
                        <h3 class="brand-font text-2xl font-bold mt-2 mb-4">${item.title}</h3>
                        <p class="text-sm text-gray-500 mb-8 font-light">${item.desc}</p>
                        <a href="${item.link}" class="inline-block text-[10px] font-bold tracking-widest border-b-2 border-[#991b1b] pb-1 hover:text-[#991b1b] transition-all uppercase">Enter Repository</a>
                    </div>
                </div>
            `;
            grid.innerHTML += card;
        });
    </script>
</body>
</html>
